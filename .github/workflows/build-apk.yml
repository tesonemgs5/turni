name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Numero build dell'APK (contatore delle esecuzioni di questo workflow): finisce nella versione #N.
      # Il sito web legge questo stesso numero da GitHub (vite.config.js), cosi' il # e' uguale.
      APK_BUILD_NUM: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Crea .env per la build (solo nel cloud)
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$SUPA_URL" "$SUPA_KEY" > .env

      - name: Prepara keystore e firma
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/android/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" \
            > android/keystore.properties

      - run: npm ci

      - name: Cap sync
        run: npm run build && npx cap sync android
      - name: Build APK (stesso script che usi sul PC)
        run: |
          chmod +x android/gradlew
          python3 aggiorna_versione_e_build.py --auto

      - name: Prepara APK per la pubblicazione
        id: version
        run: |
          APK=$(find release-builds -type f -name '*.apk' | sort | tail -1)
          test -n "$APK"
          cp "$APK" turni.apk
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turni-apk-${{ github.run_id }}
          path: turni.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APK_BUILD_NUM: ${{ github.run_number }}
      VERSION: ${{ needs.apk.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: turni-apk-${{ github.run_id }}
          path: release-artifacts
      - name: Pubblica su Releases (tiene le ultime 2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release-artifacts/turni.apk \
            --target "$GITHUB_SHA" \
            --title "Turni $VERSION#$APK_BUILD_NUM" \
            --notes "Build automatica dal commit ${GITHUB_SHA::7}" \
            --latest
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
          | while read -r OLD; do gh release delete "$OLD" --yes --cleanup-tag; done
