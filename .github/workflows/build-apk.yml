name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      # Numero build dell'APK (contatore delle esecuzioni di questo workflow): finisce nella versione #N.
      # Il sito web legge questo stesso numero da GitHub (vite.config.js), cosi' il # e' uguale.
      APK_BUILD_NUM: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21

      - name: Crea .env per la build (solo nel cloud)
        env:
          SUPA_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$SUPA_URL" "$SUPA_KEY" > .env

      - name: Prepara keystore e firma
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/android/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" \
            > android/keystore.properties

      - run: npm ci

      - name: Cap sync
        run: npm run build && npx cap sync android
      - name: Build APK (stesso script che usi sul PC)
        run: |
          chmod +x android/gradlew
          python3 aggiorna_versione_e_build.py --auto

      - name: Prepara APK per la pubblicazione
        id: version
        run: |
          APK=$(find release-builds -type f -name '*.apk' | sort | tail -1)
          test -n "$APK"
          cp "$APK" turni.apk
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: turni-apk-${{ github.run_id }}
          path: turni.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APK_BUILD_NUM: ${{ github.run_number }}
      VERSION: ${{ needs.apk.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Serve solo src/aggiornamenti.json (novità mostrate nel pop-up dell'app)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            src/aggiornamenti.json
            tool/apk_patch.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: turni-apk-${{ github.run_id }}
          path: release-artifacts
      - name: Pubblica su Releases (tiene le ultime 2)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="${VERSION}#${APK_BUILD_NUM}"
          CANALE="canale-aggiornamenti"
          mkdir -p patch-release
          # Canale fisso con l'APK base e le patch: l'app scarica da qui solo la differenza.
          # E' una pre-release: non diventa mai "l'ultima versione" e non rientra nelle
          # ultime 2 release da tenere (la pulizia piu' sotto lo salta).
          gh release view "$CANALE" >/dev/null 2>&1 || gh release create "$CANALE" \
            --title "Canale aggiornamenti (patch)" \
            --notes "File usati dall'app per aggiornarsi scaricando poco: APK base e patch. Non e' una versione da installare a mano." \
            --prerelease --latest=false
          FORCE_FULL=false
          case "$HEAD_MSG" in *"[completo]"*) FORCE_FULL=true ;; esac
          if ! python3 tool/apk_patch.py plan \
              --repo "${GH_REPO}" --tag "$CANALE" \
              --new release-artifacts/turni.apk --build "${APK_BUILD_NUM}" \
              --out patch-release --slim true --force-full "$FORCE_FULL"; then
            rm -f patch-release/patches.json patch-release/patch-*.dpat
            echo '{"full": true, "patch": null, "delete": [], "reason": "calcolo delle patch non riuscito"}' > patch-release/decision.json
          fi
          IS_FULL=$(jq -r .full patch-release/decision.json)
          if [ -f patch-release/patches.json ]; then
            # Prima la base (se nuova), poi l'elenco: l'elenco non punta mai a una base assente.
            if [ "$IS_FULL" = "true" ]; then
              gh release upload "$CANALE" release-artifacts/turni.apk --clobber
            fi
            UPLOAD=(patch-release/patches.json)
            for F in patch-release/patch-*.dpat; do
              if [ -f "$F" ]; then UPLOAD+=("$F"); fi
            done
            gh release upload "$CANALE" "${UPLOAD[@]}" --clobber
            for NOME in $(jq -r '.delete[]' patch-release/decision.json); do
              gh release delete-asset "$CANALE" "$NOME" --yes || true
            done
          fi
          # Descrizione del tipo di aggiornamento, come in DartPDF.
          APK_BYTES=$(stat -c%s release-artifacts/turni.apk)
          if [ "$IS_FULL" = "true" ]; then
            KIND=full
            MOTIVO=$(jq -r '.reason // "serve l'"'"'APK intero"' patch-release/decision.json | sed \
              -e "s/nessuna base precedente/non c'e' una versione precedente da cui partire/" \
              -e "s/patch troppo grande/la patch sarebbe troppo grande/" \
              -e "s/richiesto con \[completo\]/e' stato richiesto l'APK completo/" \
              -e "s/catena di patch troppo lunga/la catena di patch e' troppo lunga/")
            KIND_LINE="Aggiornamento: completo, circa $(( (APK_BYTES + 1048575) / 1048576 )) MB, perche' ${MOTIVO}"
          else
            KIND=patch
            PATCH_FILE=$(jq -r .patch patch-release/decision.json)
            PATCH_BYTES=$(stat -c%s "patch-release/$PATCH_FILE")
            KIND_LINE="Aggiornamento: patch, circa $(( (PATCH_BYTES + 1048575) / 1048576 )) MB"
          fi
          # Novita' mostrate nel pop-up dell'app: voci di src/aggiornamenti.json piu'
          # nuove di quelle gia' presenti nell'ultima release (marcatore agg:N).
          PREV_BODY=$(gh release view --json body --jq .body 2>/dev/null || true)
          PREV_N=$(printf '%s' "$PREV_BODY" | sed -n 's/.*<!-- agg:\([0-9][0-9]*\) -->.*/\1/p' | head -1)
          PREV_N=${PREV_N:-0}
          MAX_N=$(jq 'map(.n) | max // 0' src/aggiornamenti.json)
          NOTE=$(jq -r --argjson p "$PREV_N" '
            (if $p == 0 then .[:3] else [ .[] | select(.n > $p) ] end)
            | (if length == 0 then .[:0] else . end)
            | .[] | "• \(.titolo)\n" + ((.righe // []) | map("   – " + .) | join("\n")) + "\n"
          ' src/aggiornamenti.json)
          if [ -z "$(printf '%s' "$NOTE" | tr -d '[:space:]')" ]; then
            SUBJECT=$(printf '%s' "$HEAD_MSG" | head -n 1 | sed -E 's/^[0-9]+[[:space:]]+//')
            NOTE="• ${SUBJECT:-Miglioramenti e correzioni}"
          fi
          BODY=$(printf '%s\n\n%s\n<!-- update-kind:%s -->\n<!-- agg:%s -->\n<!-- app-build:%s -->\n<!-- commit:%s -->' \
            "$NOTE" "$KIND_LINE" "$KIND" "$MAX_N" "$APK_BUILD_NUM" "${GITHUB_SHA::7}")
          # Fino a 3 tentativi: un errore momentaneo di GitHub non deve far fallire la build.
          for TENTATIVO in 1 2 3; do
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            if gh release create "$TAG" release-artifacts/turni.apk \
              --target "$GITHUB_SHA" \
              --title "Turni $VERSION#$APK_BUILD_NUM" \
              --notes "$BODY" \
              --latest; then
              break
            fi
            if [ "$TENTATIVO" = 3 ]; then
              echo "Pubblicazione release fallita dopo 3 tentativi"
              exit 1
            fi
            echo "Pubblicazione fallita (tentativo $TENTATIVO/3), riprovo tra 15 secondi"
            sleep 15
          done
          gh release list --limit 100 --json tagName,createdAt \
            --jq "map(select(.tagName != \"${CANALE}\")) | sort_by(.createdAt) | reverse | .[2:] | .[].tagName" \
          | while read -r OLD; do gh release delete "$OLD" --yes --cleanup-tag; done
      - name: Verifica canale aggiornamenti app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${VERSION}#${APK_BUILD_NUM}"
          LATEST=$(gh release view --json tagName --jq .tagName)
          test "$LATEST" = "$TAG"
          gh release view "$TAG" --json assets \
            --jq '[.assets[].name] | index("turni.apk") != null' | grep -qx true
          # Il canale delle patch deve essere alla build appena pubblicata (avviso, non blocca).
          CUR=$(gh release download canale-aggiornamenti --pattern patches.json --output - 2>/dev/null | jq -r '.current.build' 2>/dev/null || true)
          if [ "$CUR" != "$APK_BUILD_NUM" ]; then
            echo "::warning::Canale patch alla build '${CUR:-?}' invece di ${APK_BUILD_NUM}: l'app scarichera' l'APK completo"
          fi
